- name: WatchedServices
  description: >-
    SELECT THIS for "which services are we watching", "what is set up". The services this world
    watches, each with its namespace, app label, repository and where its logs are read.
  cypher: |
    MATCH (w:WatchedService)
    RETURN w.key AS key, w.namespace AS namespace, w.app AS app, w.repo AS repo, w.logs AS logs
    ORDER BY key
