name: which-change
description: |
  Which change broke production? From a failure in a Java service's logs to the line that threw it,
  the commit that last changed that line, who wrote it and whether a coding agent helped, and the
  pull request that brought it in. One query, with nothing installed in the application.

  It adds no data of its own. Its views join realms that each know one thing: realm-jvm-logs (the
  failure and its stack trace), realm-polyglot-code (the repository's files), realm-git (who last
  changed each line), realm-github (the pull request) and realm-kubernetes (what is running, at
  which commit).

  No jar is needed: the application's own code is whichever stack frame names a file that is in
  the repository at the commit that was running.

  Requires realm-jvm-logs, realm-polyglot-code, realm-git, realm-github, realm-kubernetes and
  realm-dev-vocabulary. With realm-elastic-logs installed, WhatBrokeFromLogs runs the same chain
  from the log store: counted over every event, and still there after the pod is gone.
version: 0.1.2
maturity: experimental
url: https://github.com/embabel-worlds/realm-which-change
author: Rod Johnson
category: developer
